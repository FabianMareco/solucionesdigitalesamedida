<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Big Shoulders Display"; font-weight: 100 900; src: url(assets/fonts/big-shoulders-display-latin-wght-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: "Big Shoulders Display"; font-weight: 100 900; src: url(assets/fonts/big-shoulders-display-latin-ext-wght-normal.woff2) format("woff2"); unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: "Hanken Grotesk"; font-weight: 100 900; src: url(assets/fonts/hanken-grotesk-latin-wght-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: "Hanken Grotesk"; font-weight: 100 900; src: url(assets/fonts/hanken-grotesk-latin-ext-wght-normal.woff2) format("woff2"); unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      :root {
        --noche: #2b0d14;
        --dia: #f9e7dc;
        --tinta: #570000;
        --carmesi: #b10f2e;
        --salmon: #de7c5a;
        --crema: #fdffff;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--dia); }
      #root { position: relative; width: 100%; height: 100%; font-family: "Hanken Grotesk", sans-serif; }
      /* el cierre nace de la última notificación: va por encima de la historia */
      #historia { z-index: 1; }
      #cierre { z-index: 2; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="27" data-width="1080" data-height="1920">
      <div id="historia" data-composition-id="historia" data-composition-src="compositions/historia.html"
        data-start="0" data-duration="21.8" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="cierre" data-composition-id="cierre" data-composition-src="compositions/cierre.html"
        data-start="21" data-duration="6" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
