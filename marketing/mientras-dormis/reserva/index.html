<!doctype html>
<html lang="es">
<!-- Made with the Bang Motion skill by Bang Tutorial (https://youtube.com/bangtutorial) - MIT - https://github.com/bangtutorial/bang-motion -->
<head>
<meta charset="utf-8">
<title>Reserva de noche</title>
<!--
  «Lo que pasa mientras dormís» · escenas 4–7 (15 s, 9:16).
  Style brief: cálido, ordenado, hecho a mano · papel recortado (borde de tijera + sombra de papel clavado + gouache), el mismo mundo que las escenas de huashu
  · paleta de la marca: carmesí #B10F2E, papel #F4EFE4, tinta #1D1A17, noche #2E2622, oro #E8B04A, salvia #7C9A7E
  · firma de movimiento: las piezas de papel caen, rebotan apenas y quedan clavadas con su sombra
  · fondo vivo: la luz de la ventana respira y el gouache se mueve · momento especial: el sello de la seña (砸入, una sola vez).
  Textos de la historia: los pone explainroo encima. Acá solo hay texto que es parte del producto (la web, la agenda).
  Determinista: todo sale de tl.time(). ?debug=1 = panel para recorrer; ?clean=1 = para exportar.
-->
<style>
@font-face{font-family:Caveat;src:url(Caveat.ttf)}
@font-face{font-family:InterV;src:url(Inter-var.woff);font-weight:100 900}
:root{--cream:#F4EFE4;--creamD:#E4D8C4;--crim:#B10F2E;--crimD:#86102A;--ink:#1D1A17;--night:#2E2622;--gold:#E8B04A;--sage:#7C9A7E;--sageD:#5E7A62;--skin:#E2A98A}
html,body{margin:0;height:100%;background:#0a0a0a;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;overflow:hidden;background:var(--night);font-family:InterV,sans-serif;color:var(--ink)}
#world{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;will-change:transform}
.a{position:absolute}
.sh{filter:drop-shadow(5px 6px 3px rgba(20,12,8,.34))}
.sh2{filter:drop-shadow(9px 12px 6px rgba(20,12,8,.34))}
.pp{position:absolute}
#gouache{position:absolute;inset:0;mix-blend-mode:overlay;pointer-events:none}
.cell{position:absolute;width:56px;height:52px;display:grid;place-items:center;font:600 24px InterV;color:var(--ink)}
.pill{position:absolute;height:64px;width:132px;display:grid;place-items:center;font:600 28px InterV;color:var(--ink)}
.hand{font-family:Caveat;font-weight:600}
#dbg{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:none;gap:12px;align-items:center;padding:10px 16px;border-radius:14px;background:rgba(14,16,22,.9);color:#cfd5e3;font:13px system-ui;z-index:50}
#dbg input{width:360px}
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <!-- cielo, estrellas y luna (se ven cuando la cámara se aleja) -->
    <div class="pp" style="left:-3000px;top:-4000px;width:8000px;height:3300px;background:var(--night)" data-j="40"></div>
    <div id="stars"></div>
    <div class="sh2 a" id="moon" style="left:2350px;top:-1550px"><div class="pp" style="width:300px;height:300px;border-radius:50%;background:var(--gold)" data-j="0"></div><div class="pp" style="left:120px;top:-50px;width:280px;height:280px;border-radius:50%;background:var(--night)" data-j="0"></div></div>
    <!-- la pared del edificio con sus ventanas apagadas -->
    <div class="sh2"><div class="pp" style="left:-2200px;top:-700px;width:6200px;height:8000px;background:var(--sageD)" data-j="30"></div>
      <div class="pp" style="left:-2260px;top:-800px;width:6300px;height:110px;background:var(--crimD)" data-j="20"></div></div>
    <div id="wins"></div>
    <!-- la ventana encendida de la clienta -->
    <div class="sh2"><div class="pp" style="left:-830px;top:-100px;width:2740px;height:2120px;background:var(--cream)" data-j="16"></div></div>
    <div class="pp" id="lit" style="left:-760px;top:-30px;width:2600px;height:1980px;background:var(--gold)" data-j="16"></div>
    <div class="a" id="glow" style="left:-760px;top:-30px;width:2600px;height:1980px;background:radial-gradient(50% 45% at 50% 50%,#fff6d8,transparent 70%);opacity:0"></div>
    <!-- la mano con el celular -->
    <div class="sh2 a" id="arm" style="left:330px;top:1180px"><div class="pp" style="left:-40px;top:300px;width:540px;height:900px;background:var(--crim)" data-j="14"></div>
      <div class="pp" style="left:-10px;top:-40px;width:470px;height:420px;border-radius:44% 44% 30% 30%;background:var(--skin)" data-j="0"></div></div>
    <div class="sh2 a" id="phone" style="left:280px;top:520px">
      <div class="pp" style="width:520px;height:960px;border-radius:64px;background:var(--ink)" data-j="0"></div>
      <div class="a" id="screen" style="left:24px;top:40px;width:472px;height:880px;border-radius:34px;overflow:hidden;background:var(--cream)">
        <!-- la web del negocio -->
        <div class="a" style="left:0;top:0;width:472px;height:84px;background:var(--crim)"></div>
        <div class="a" style="left:26px;top:26px;width:30px;height:30px;border-radius:50%;background:var(--sage)"></div>
        <div class="a" style="left:66px;top:26px;width:30px;height:30px;border-radius:50%;background:var(--cream)"></div>
        <div class="a" style="left:106px;top:26px;width:30px;height:30px;border-radius:50%;background:var(--sage)"></div>
        <div class="a" style="left:400px;top:30px;width:44px;height:6px;background:var(--cream);box-shadow:0 11px 0 var(--cream),0 22px 0 var(--cream)"></div>
        <div class="a hand" style="left:30px;top:110px;font-size:70px;line-height:1">Turnos online</div>
        <div class="a" style="left:32px;top:196px;font:500 26px InterV;color:#5a514a">Reservá en un minuto, cuando quieras.</div>
        <div class="a" style="left:30px;top:252px;width:412px;height:270px;border-radius:24px;background:var(--sage);overflow:hidden">
          <div class="a" id="websun" style="left:250px;top:40px;width:120px;height:120px;border-radius:50%;background:var(--gold)"></div>
          <div class="a" style="left:-40px;top:170px;width:300px;height:160px;border-radius:50%;background:var(--sageD)"></div>
          <div class="a" style="left:170px;top:190px;width:320px;height:160px;border-radius:50%;background:#6E8C71"></div></div>
        <div class="a" id="btn" style="left:76px;top:572px;width:320px;height:96px;border-radius:48px;background:var(--crim);color:var(--cream);font:700 40px InterV;display:grid;place-items:center">Reservar</div>
        <div class="a" id="ripple" style="left:236px;top:620px;width:20px;height:20px;margin:-10px;border-radius:50%;background:rgba(244,239,228,.6);opacity:0"></div>
        <div class="a" style="left:384px;top:778px;width:64px;height:64px;border-radius:50%;background:var(--sage)"></div>
        <!-- acordeón: cuatro paneles que se despliegan y forman la agenda -->
        <div id="acc"></div>
        <div id="agenda" class="a" style="left:0;top:0;width:472px;height:880px">
          <div class="a hand" id="mes" style="left:0;width:472px;top:96px;text-align:center;font-size:64px;opacity:0">Noviembre</div>
          <div id="strips"></div>
          <svg class="a" id="ringSvg" style="left:0;top:0;width:472px;height:880px;overflow:visible" viewBox="0 0 472 880"><path id="ring" d="" fill="none" stroke="#B10F2E" stroke-width="6" stroke-linecap="round"/></svg>
          <div id="pills"></div>
          <div class="a sh" id="box" style="left:146px;top:690px;opacity:0"><div class="pp" style="width:180px;height:120px;border-radius:10px;background:var(--crimD)" data-j="0"></div><div class="pp" style="left:50px;top:18px;width:80px;height:12px;border-radius:6px;background:var(--ink)" data-j="0"></div><div class="a hand" style="left:0;top:40px;width:180px;text-align:center;font-size:52px;color:var(--cream)">Seña</div></div>
          <div class="a sh" id="coin" style="left:196px;top:-120px;opacity:0"><div class="pp" style="width:80px;height:80px;border-radius:50%;background:var(--gold)" data-j="0"></div><div class="a" style="left:0;top:14px;width:80px;text-align:center;font:800 40px InterV;color:#9A6B1F">$</div></div>
          <div class="a" id="notif" style="left:20px;top:110px;width:432px;height:120px;border-radius:24px;background:var(--ink);color:var(--cream);opacity:0">
            <div class="a" style="left:22px;top:22px;width:76px;height:76px;border-radius:18px;background:var(--crim)"></div>
            <div class="a" style="left:116px;top:22px;font:700 28px InterV">Recordatorio</div>
            <div class="a" style="left:116px;top:62px;font:500 26px InterV;color:#d9cfbe">Jueves 10:00 · seña paga ✓</div></div>
          <div class="a" id="dark" style="left:0;top:0;width:472px;height:880px;background:#121010;opacity:0"></div>
        </div>
      </div>
    </div>
    <!-- el dedo que toca (pulgar de papel) -->
    <div class="sh2 a" id="thumb" style="left:620px;top:1500px"><div class="pp" style="width:96px;height:250px;border-radius:48px 48px 30px 30px;background:var(--skin)" data-j="0"></div></div>
    <!-- el sello -->
    <div class="a" id="stamp" style="left:540px;top:930px;opacity:0"><div style="position:absolute;left:-230px;top:-90px;width:460px;height:180px;border:10px solid var(--sage);border-radius:22px;display:grid;place-items:center;color:var(--sage);font-family:Caveat;font-weight:600;font-size:120px;line-height:1;background:rgba(244,239,228,.35)">Seña ✓</div></div>
    <!-- el sobre del recordatorio -->
    <div class="sh2 a" id="env" style="left:-1100px;top:300px;opacity:0"><div class="pp" style="width:420px;height:280px;background:var(--cream)" data-j="6"></div>
      <svg class="a" style="left:0;top:0" width="420" height="280"><path d="M0 0 L210 150 L420 0 Z" fill="#B10F2E"/><path d="M0 280 L170 130 M420 280 L250 130" stroke="#C9B9A2" stroke-width="5"/></svg>
      <div class="a hand" style="left:24px;top:190px;font-size:52px;color:var(--ink)">jueves 10 h</div></div>
  </div>
  <canvas id="gouache" width="1080" height="1920"></canvas>
  <div id="dbg"><button id="dPlay">Pause</button><input id="dScrub" type="range" min="0" max="1000" value="0"><span id="dClock">0.00s</span></div>
</div>
<script src="gsap.min.js"></script>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const W=1080,H=1920,DUR=15;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);$('#stage').style.transform=`translate(-50%,-50%) scale(${s})`;}
addEventListener('resize',fit);fit();
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ---------- borde de tijera: polígono con temblor en cada pieza rectangular (data-j = paso; 0 = sin recorte) ---------- */
let seed=7;
$$('.pp').forEach(el=>{const step=+el.dataset.j;if(!step)return;const r=rng(seed+=13),w=parseFloat(el.style.width),h=parseFloat(el.style.height),pts=[];
  const edge=(x0,y0,x1,y1)=>{const L=Math.hypot(x1-x0,y1-y0),n=Math.max(2,Math.round(L/Math.max(step,w/60,h/60)));for(let i=0;i<n;i++){const q=i/n;pts.push([x0+(x1-x0)*q+(r()-.5)*4,y0+(y1-y0)*q+(r()-.5)*4]);}};
  edge(0,0,w,0);edge(w,0,w,h);edge(w,h,0,h);edge(0,h,0,0);
  el.style.clipPath='polygon('+pts.map(p=>`${(p[0]/w*100).toFixed(2)}% ${(p[1]/h*100).toFixed(2)}%`).join(',')+')';});

/* ---------- ventanas apagadas, estrellas ---------- */
(()=>{let h='';for(let j=-2;j<7;j++)for(let i=-3;i<7;i++){const x=-760+i*640,y=-30+j*700;if(x>-1300&&x<1900&&y>-100&&y<2000&&!(x>=-800&&x<=1840&&y>=-60&&y<=1960))continue;
  if(x>-800&&x<1900&&y>-200&&y<2050)continue;h+=`<div class="pp sh" style="left:${x+80}px;top:${y+60}px;width:440px;height:520px;background:#2A221E" data-j="20"></div>`;}
  $('#wins').innerHTML=h;
  let s='';const r=rng(99);for(let k=0;k<40;k++){const x=-2800+r()*7600,y=-3600+r()*2700,z=14+r()*16;s+=`<div class="a st" style="left:${x}px;top:${y}px;width:${z}px;height:${z}px;background:var(--gold);clip-path:polygon(50% 0,61% 38%,100% 50%,61% 62%,50% 100%,39% 62%,0 50%,39% 38%)"></div>`;}
  $('#stars').innerHTML=s;})();
/* re-aplicar recorte a las piezas creadas por JS */
$$('#wins .pp').forEach(el=>{const r=rng(seed+=13),w=440,h=520,pts=[];const e=(x0,y0,x1,y1)=>{for(let i=0;i<14;i++){const q=i/14;pts.push([x0+(x1-x0)*q+(r()-.5)*4,y0+(y1-y0)*q+(r()-.5)*4]);}};e(0,0,w,0);e(w,0,w,h);e(w,h,0,h);e(0,h,0,0);el.style.clipPath='polygon('+pts.map(p=>`${(p[0]/w*100).toFixed(2)}% ${(p[1]/h*100).toFixed(2)}%`).join(',')+')';});

/* ---------- acordeón, tiras de la agenda, horarios ---------- */
(()=>{let a='';const cols=['#F4EFE4','#EFE7D8','#F4EFE4','#EFE7D8'];for(let i=0;i<4;i++)a+=`<div class="a pnl" style="left:0;top:${i*220}px;width:472px;height:220px;background:${cols[i]};transform-origin:50% 0;opacity:0;box-shadow:inset 0 -3px 0 rgba(29,26,23,.06)"></div>`;$('#acc').innerHTML=a;
  let s='';const L='LMMJVSD';s+=`<div class="a strip" style="left:12px;top:180px;width:448px;height:40px;opacity:0">${[...L].map((d,i)=>`<div class="a" style="left:${i*64}px;width:56px;text-align:center;font:700 22px InterV;color:#8a7f73">${d}</div>`).join('')}</div>`;
  let n=1;for(let j=0;j<4;j++){s+=`<div class="a strip sh" style="left:12px;top:${232+j*64}px;width:448px;height:56px;opacity:0">`;for(let i=0;i<7;i++){s+=`<div class="cell" style="left:${i*64}px;background:${(i>4)?'#E9DFCC':'#fff'};border-radius:8px">${n}</div>`;n++;}s+='</div>';}
  $('#strips').innerHTML=s;
  const P=['9:00','10:00','11:30'];$('#pills').innerHTML=P.map((p,i)=>`<div class="pill sh" id="pill${i}" style="left:${18+i*148}px;top:520px;background:#fff;border-radius:32px;opacity:0">${p}</div>`).join('');
  // círculo a mano sobre el jueves de la tercera semana (col 3, fila 2)
  const cx=12+3*64+28,cy=232+2*64+28,r=rng(5);let d='';for(let k=0;k<=34;k++){const a=-1.9+k/34*7.0,rr=40+(r()-.5)*5+k*.15;d+=(k?'L':'M')+(cx+Math.cos(a)*rr*1.12).toFixed(1)+' '+(cy+Math.sin(a)*rr*.95).toFixed(1)+' ';}
  $('#ring').setAttribute('d',d);})();

/* ---------- gouache (pantalla), igual que en las escenas de huashu ---------- */
(()=>{const g=$('#gouache').getContext('2d'),r=rng(2026);g.lineCap='round';for(let i=0;i<2200;i++){const x=r()*W,y=r()*H,a=-.25+(r()-.5)*.5,L=60+r()*240;
  g.strokeStyle=r()<.5?`rgba(255,255,255,${.04+r()*.06})`:`rgba(0,0,0,${.03+r()*.05})`;g.lineWidth=6+r()*16;g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*L,y+Math.sin(a)*L);g.stroke();}})();

/* ---------- cámara ---------- */
const tl=gsap.timeline({paused:true}),rig=$('#world');
const C={x:540,y:1000,z:.4,sx:0,sy:0};
function applyCam(){rig.style.transform=`translate(${540-C.x*C.z+C.sx}px,${960-C.y*C.z+C.sy}px) scale(${C.z})`;}
const cam=(at,x,y,z,dur,ease='sine.inOut')=>tl.to(C,{x,y,z,duration:dur,ease,onUpdate:applyCam},at);
/* piezas que caen, rebotan apenas y quedan clavadas */
const drop=(sel,at,{y=-260,x=0,rot=-8,dur=.55}={})=>tl.fromTo(sel,{opacity:0,y,x,rotate:rot,scale:1.06},{opacity:1,y:0,x:0,rotate:0,scale:1,duration:dur,ease:'back.out(1.7)',immediateRender:false},at);

/* 0–4 s · Escena 4: el celular con la web, el dedo toca Reservar, la página se despliega */
tl.set(C,{x:540,y:1000,z:.4,onUpdate:applyCam},0);
cam(0,540,1020,1.0,1.3,'power2.inOut');
tl.fromTo('#thumb',{x:220,y:260,rotate:12},{x:-280,y:-420,rotate:-6,duration:.7,ease:'power3.out',immediateRender:false},1.1);
tl.to('#btn',{scale:.92,duration:.1,ease:'power2.in'},1.82).to('#btn',{scale:1,duration:.3,ease:'back.out(3)'},1.92);
tl.fromTo('#ripple',{opacity:1,scale:1},{opacity:0,scale:22,duration:.6,ease:'power2.out',immediateRender:false},1.85);
tl.to('#thumb',{x:220,y:300,rotate:14,duration:.5,ease:'power2.in'},2.1);
$$('.pnl').forEach((p,i)=>tl.fromTo(p,{opacity:1,rotateX:-90,transformPerspective:900},{rotateX:0,duration:.45,ease:'back.out(1.4)',immediateRender:false},2.15+i*.22));
tl.fromTo('#acc',{opacity:1},{opacity:1,duration:.01},2.1);
/* 4–8 s · Escena 5: la agenda se arma con tiras; el jueves queda marcado; se elige 10:00 */
cam(3.9,540,940,1.55,1.1,'power2.inOut');
tl.fromTo('#mes',{opacity:0,y:-30},{opacity:1,y:0,duration:.5,ease:'power3.out',immediateRender:false},4.2);
$$('.strip').forEach((s,i)=>tl.fromTo(s,{opacity:0,x:i%2?520:-520,rotate:i%2?4:-4},{opacity:1,x:0,rotate:0,duration:.55,ease:'back.out(1.5)',immediateRender:false},4.35+i*.16));
(()=>{const p=$('#ring'),L=p.getTotalLength();p.style.strokeDasharray=L;tl.fromTo(p,{strokeDashoffset:L},{strokeDashoffset:0,duration:.6,ease:'power2.inOut',immediateRender:true},5.45);})();
$$('.pill').forEach((p,i)=>drop(p,6.1+i*.12,{y:-60,rot:i%2?5:-5,dur:.45}));
tl.to('#pill1',{backgroundColor:'#B10F2E',color:'#F4EFE4',scale:1.12,duration:.25,ease:'power3.out'},6.95).to('#pill1',{scale:1,duration:.3,ease:'back.out(3)'},7.2);
/* 8–11 s · Escena 6: la moneda cae en la caja de la seña; el sello golpea (砸入, una sola vez) */
drop('#box',7.9,{y:-120,rot:4,dur:.5});
tl.fromTo('#coin',{opacity:1,y:0,rotate:0},{y:770,rotate:300,duration:.62,ease:'power2.in',immediateRender:false},8.35);
tl.to('#coin',{opacity:0,duration:.06},8.95);
tl.to('#box',{y:8,duration:.08,ease:'power2.out'},8.96).to('#box',{y:0,duration:.25,ease:'back.out(3)'},9.04);
tl.fromTo('#stamp',{opacity:0,scale:2.6,rotate:-2},{opacity:1,scale:1,rotate:-8,duration:.22,ease:'power4.in',immediateRender:false},9.3);
cam(9.3,540,940,1.95,.22,'power4.in');
tl.to(C,{keyframes:[{sx:14,sy:-10},{sx:-12,sy:8},{sx:6,sy:-4},{sx:0,sy:0}],duration:.32,ease:'none',onUpdate:applyCam},9.52);
cam(9.6,540,950,1.7,.9,'power2.out');
/* 11–15 s · Escena 7: la cámara se aleja; el recordatorio vuela hasta la ventana; la luz se apaga */
tl.to('#stamp',{opacity:0,scale:.9,duration:.3,ease:'power2.in'},10.8);
tl.to(['#box','#strips','#mes','#pills','#ringSvg'],{opacity:0,duration:.3},10.8);
cam(10.9,700,700,.34,2.1,'power2.inOut');
tl.fromTo('#env',{opacity:1,x:0,y:0,rotate:-14,scale:1.6},{x:1640,y:560,rotate:6,scale:.5,duration:1.45,ease:'power1.inOut',immediateRender:false},11.6);
tl.to('#env',{opacity:0,scale:.2,duration:.25,ease:'power2.in'},13.05);
tl.fromTo('#notif',{opacity:0,y:-40},{opacity:1,y:0,duration:.4,ease:'back.out(2)',immediateRender:false},13.15);
tl.to('#dark',{opacity:1,duration:.35,ease:'power2.in'},14.05);
tl.to('#lit',{backgroundColor:'#3B302A',duration:.35,ease:'power2.in'},14.05);
tl.to('#glow',{autoAlpha:0,duration:.2},14.05);
/* fondo vivo: la luz respira, las estrellas titilan, el sol de la web gira apenas */
tl.fromTo('#glow',{opacity:0},{opacity:.12,duration:1.2,ease:'sine.inOut',yoyo:true,repeat:9,immediateRender:false},0);
tl.to('#websun',{rotate:40,duration:4,ease:'none'},0);
$$('.st').forEach((s,i)=>tl.to(s,{scale:.55,rotate:30,duration:.9+(i%5)*.2,ease:'sine.inOut',yoyo:true,repeat:9},(i%7)*.13));
tl.to('#moon',{y:-30,duration:3,ease:'sine.inOut',yoyo:true,repeat:3},0);
tl.to({},{duration:.01},DUR-.01);

/* ---------- control: autoplay + loop sin player; ?debug=1 panel; ?clean=1 exportar ---------- */
const q=new URLSearchParams(location.search);
window.OPENER={W,H,DURATION:DUR,tl,ready:false,seek(t){tl.pause(t,false);applyCam();}};
document.fonts.ready.then(()=>{window.OPENER.ready=true;applyCam();
  if(q.has('clean'))tl.pause(0);else{tl.eventCallback('onComplete',()=>tl.play(0));tl.play(0);}
  if(q.has('debug')){const d=$('#dbg');d.style.display='flex';const sc=$('#dScrub');sc.oninput=()=>{tl.pause(sc.value/1000*DUR);applyCam();};
    $('#dPlay').onclick=()=>tl.paused()?tl.play():tl.pause();gsap.ticker.add(()=>{$('#dClock').textContent=tl.time().toFixed(2)+'s';});}});
addEventListener('keydown',e=>{if(e.key==='r'||e.key==='R')tl.play(0);if(e.key===' ')tl.paused()?tl.play():tl.pause();});
</script>
</body>
</html>
