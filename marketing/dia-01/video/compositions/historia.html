      // Burbujas: cada mensaje nuevo entra abajo y empuja a los anteriores (máximo tres a la vista).

        for (let j = 0; j < i; j++) {
          const lift = -(i - j) * step;
          tl.to(bubbles[j], { y: lift, opacity: i - j >= 3 ? 0 : 1, duration: 0.35, ease: "power3.out" }, times[i]);
        }
      });

      // Abajo: el título y las notificaciones llegan tranquilas.
      words("#h-t2", 3.1);
      const stack = (cards, starts) => cards.forEach((c, i) => {
        tl.fromTo(c, { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.55, ease: "back.out(1.3)" }, starts[i]);
        if (i > 0) { tl.to(cards[i - 1], { y: 22, scale: 0.94, duration: 0.45, ease: "power3.out" }, starts[i]); tl.to(cards[i - 1] + " > *", { opacity: 0, duration: 0.2, ease: "power3.in" }, starts[i]); }
